<div class="layout">
  <mat-sidenav-container>
    <mat-sidenav #sidenav [(opened)]="opened" class="side-nav">
      <div class="side-inner">
        <div (click)="onBasicNavigating('')" class="brand">
          <mat-icon>school</mat-icon>
          <h2>E-Tutor</h2>
        </div>

        <div *ngIf="currentUser; else authenticate" (click)="onBasicNavigating('profile')" class="user-link">
          <img class="profile-img" [src]="currentUser?.profileImagePath ?? 'assets/images/default_avatar.png'"/>
          <p>{{ currentUser?.firstName }} {{ currentUser?.lastName }}</p>
        </div>

        <ng-template #authenticate>
          <div class="auth-links">
            <button (click)="onBasicNavigating('login')" class="auth-btn">Login</button>
            <button (click)="onBasicNavigating('register')" class="auth-btn">Signup</button>
          </div>
        </ng-template>

        <p (click)="onNavigating(sidenav, 'tutor')" class="link">Tutors advertisements</p>
        <p (click)="onNavigating(sidenav, 'student')" class="link">Students advertisements</p>

        <button class="auth-btn logout-btn" *ngIf="isAuth" (click)="onLoggingOut()">Logout</button>
      </div>
    </mat-sidenav>

    <mat-sidenav-content class="content">
      <app-menu (responsiveNavOpen)="opened = true"></app-menu>
      <router-outlet></router-outlet>
      <app-footer></app-footer>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
