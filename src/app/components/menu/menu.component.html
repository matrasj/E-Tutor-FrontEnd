<div class="hero">
  <header class="topbar">
    <div class="brand" routerLink="/">
      <mat-icon>school</mat-icon>
      <span>E-Tutor</span>
    </div>

    <nav class="primary-nav" *ngIf="!showHamburgerIcon">
      <button class="nav-pill" (click)="onAdvertisementsForCategorySearching('tutor')">Tutors advertisements</button>
      <button class="nav-pill" (click)="onAdvertisementsForCategorySearching('student')">Students advertisements</button>
    </nav>

    <mat-icon *ngIf="showHamburgerIcon" class="hamburger" (click)="onMenuOpening()">menu</mat-icon>

    <div class="auth" *ngIf="(!isAuthenticated && !showHamburgerIcon) else authenticatedMenu">
      <a class="auth-link" routerLink="/login">Login</a>
      <button class="primary-btn main-btn" routerLink="/register">Register</button>
    </div>

    <ng-template #authenticatedMenu>
      <div class="user" *ngIf="!showHamburgerIcon">
        <div [matMenuTriggerFor]="appMenu" class="user-trigger">
          <span class="hello">Hi {{ currentUser?.firstName }} {{ currentUser?.lastName}}</span>
          <img class="avatar" [src]="currentUser?.profileImagePath ? sanitizerPhoto(currentUser?.profileImagePath) : 'assets/images/default_avatar.png'"/>
        </div>
        <mat-menu #appMenu="matMenu">
          <button mat-menu-item routerLink="/profile">
            <mat-icon>settings</mat-icon>
            Profile settings
          </button>
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            Logout
          </button>
        </mat-menu>
      </div>
    </ng-template>
  </header>

  <section class="headline" *ngIf="shouldBeHeaderVisible">
    <h1>Find great lessons and offers from over {{ totalAdvertisementsQuantity }} advertisements</h1>
  </section>

  <section class="search-card" *ngIf="shouldBeSearchFormVisible">
    <form class="search-form" (submit)="onAdvertisementsSearching($event)">
      <div class="control search-control">
        <mat-icon>search</mat-icon>
        <mat-form-field appearance="fill" class="grow">
          <input [(ngModel)]="keyPhrase" name="keyPhrase" matInput placeholder="Try: Physics">
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline" class="select-control">
        <mat-label>Category</mat-label>
        <mat-select [(value)]="selectedCategory">
          <mat-option value="tutor">Tutor's advertisements</mat-option>
          <mat-option value="student">Student's advertisements</mat-option>
          <mat-option value="all">All advertisements</mat-option>
        </mat-select>
      </mat-form-field>

      <div class="actions">
        <button class="primary-btn second-btn" type="submit" (click)="onAdvertisementsSearching()">Search</button>
        <button class="ghost-btn second-btn" type="button" (click)="onFindClosestTutorClick()">Find on map</button>
      </div>
    </form>
  </section>
</div>
