<div class="states-viewport">
  <div class="states-panel">
    <h1>States and Cities</h1>
    <div class="states-grid">
      <div class="state-card" *ngFor="let state of statesWithCitiesAndQuantities">
        <div class="state-head">
          <span class="state-name">{{ state?.name }}</span>
          <span class="state-count">({{ state?.totalAddsQuantity }})</span>
        </div>
        <div class="cities-grid">
          <div class="city-row" *ngFor="let city of state.citiesWithQuantities">
            <button class="city-main" type="button" (click)="onAdvertisementsFilteringByCity(city.cityName)">
              <mat-icon>location_on</mat-icon>
              <span class="city-name">{{ city.cityName.length > 15 ? city.cityName.slice(0, 15) + '...' : city?.cityName}}</span>
            </button>
            <span class="city-count">({{ city?.addsQuantity }})</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
