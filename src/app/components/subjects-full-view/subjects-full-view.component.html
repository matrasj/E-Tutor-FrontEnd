<div class="subjects-wrap">
  <div class="subjects-box">
    <h1>Subjects</h1>
    <div class="subjects-grid">
      <div class="subject-tile" *ngFor="let subjectWithQuan of subjectsWithQuantities" (click)="onAdvertisementsFilteringBySubject(subjectWithQuan.subjectName)">
        <div class="subject-left">
          <mat-icon>menu_book</mat-icon>
          <span class="subject-title">{{ subjectWithQuan.subjectName.length > 15 ? subjectWithQuan.subjectName.slice(0, 15) + '...' : subjectWithQuan?.subjectName }}</span>
        </div>
        <span class="subject-badge">({{ subjectWithQuan?.addsQuantity }})</span>
      </div>
    </div>
  </div>
</div>
