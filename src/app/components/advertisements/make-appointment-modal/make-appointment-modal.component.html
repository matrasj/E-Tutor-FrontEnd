<h2 mat-dialog-title class="dialog-title">
  Make an appointment
</h2>

<ng-container *ngIf="!isLoading; else loader">
  <mat-dialog-content class="dialog-content" *ngIf="appointmentFormGroup as fg">
    <div class="ad-summary" *ngIf="advertisement">
      <div class="ad-title">{{ advertisement.subjectName }} {{' -' }} {{ advertisement.userPayload.firstName }}  {{ advertisement.userPayload.lastName}}</div>
      <div class="ad-user" *ngIf="advertisement?.userPayload?.username">
        Author: <strong>{{ advertisement.userPayload.username }}</strong>
      </div>
    </div>

    <form [formGroup]="fg" (ngSubmit)="onSubmit()" class="form">
      <div formGroupName="message" class="grid">
        <mat-form-field appearance="outline" class="full">
          <mat-label>Message / visit purpose</mat-label>
          <textarea
            matInput
            rows="3"
            placeholder="Write a short message..."
            formControlName="visitContent"
          ></textarea>
        </mat-form-field>

        <mat-form-field appearance="outline" class="half">
          <mat-label>Date</mat-label>
          <input
            matInput
            [matDatepicker]="picker"
            placeholder="Pick a date"
            formControlName="visitDate"
          />
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline" class="half">
          <mat-label>Time</mat-label>
          <input
            matInput
            type="time"
            placeholder="HH:mm"
            formControlName="visitTime"
          />
        </mat-form-field>
      </div>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-actions">
    <button mat-stroked-button (click)="onCancel()">
      Cancel
    </button>
    <button mat-flat-button color="primary" (click)="onSubmit()">
      Send request
    </button>
  </mat-dialog-actions>
</ng-container>

<ng-template #loader>
  <app-loader></app-loader>
</ng-template>
