<div class="results-wrap">
  <div class="results-panel">
    <h1 class="results-title">Found <span class="results-accent">{{ totalElements }}</span> advertisements</h1>

    <ng-container *ngIf="!isLoading; else loader">
      <div class="results-list">
        <app-advertisement-row *ngFor="let advertisement of advertisements"
                               [advertisement]="advertisement"
                               (reloadEmitter)="fetchData()"
        ></app-advertisement-row>
      </div>

      <p class="empty-alert" *ngIf="advertisements.length === 0">No advertisements found</p>

      <div class="pagination-wrap">
        <ngb-pagination
          [collectionSize]="totalElements"
          [(page)]="pageNumber"
          [boundaryLinks]="true"
          [pageSize]="pageSize"
          (pageChange)="fetchData()">
        </ngb-pagination>
      </div>
    </ng-container>
  </div>
</div>

<ng-template #loader>
  <app-loader></app-loader>
</ng-template>
