<h2 mat-dialog-title>Reject visit</h2>

<ng-container *ngIf="!isLoading; else loader">
  <mat-dialog-content>
    <p>Are you sure you want to reject this visit request?</p>
    <mat-divider></mat-divider>
    <p style="margin-top: 12px; opacity: .75;">
      This action will permanently remove the visit request. The other user will be notified.
    </p>
  </mat-dialog-content>
</ng-container>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-raised-button color="warn" (click)="confirm()">Reject</button>
</mat-dialog-actions>

<ng-template #loader>
  <app-loader></app-loader>
</ng-template>
