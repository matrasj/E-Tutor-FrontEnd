<h2 mat-dialog-title>Confirm visit</h2>

<ng-container *ngIf="!isLoading; else loader">
  <mat-dialog-content>
    <p>Are you sure you want to confirm the visit?</p>
    <mat-divider></mat-divider>
    <p style="margin-top: 12px; opacity: .75;">
      The other user will be notified immediately.
    </p>
  </mat-dialog-content>
</ng-container>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-raised-button color="primary" (click)="confirm()">Confirm</button>
</mat-dialog-actions>

<ng-template #loader>
  <app-loader></app-loader>
</ng-template>
