<div class="chat-page">
  <div class="chat">
    <header class="chat-header">
      <button class="back-btn" (click)="goBack()">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <img class="peer-avatar" [src]="peer?.profileImagePath ?? 'assets/images/default_avatar.png'"/>
      <span class="peer-name">{{ peer?.firstName }} {{ peer?.lastName }}</span>
      <span class="peer-username">@{{ peer?.username }}</span>
    </header>

    <ng-container *ngIf="!isLoading; else loader">
      <div class="messages" #scrollArea>
        <div class="msg-row" *ngFor="let m of messages">
          <div class="bubble" [ngClass]="{ me: m.sender?.id === currentUser?.id }">
            <div class="bubble-meta">
              <span class="who">{{ m.sender?.id === currentUser?.id ? 'You' : m.sender?.username }}</span>
              <span class="when">{{ getFormattedDate(m?.createdAt) }}</span>
            </div>
            <div class="bubble-content" [innerHTML]="m?.content"></div>
          </div>
        </div>
      </div>

      <form class="composer" (ngSubmit)="onMessageSending()" [formGroup]="messageFormGroup">
        <editor class="composer-editor" formControlName="content"></editor>

        <div class="composer-actions">
          <button type="submit" class="send-btn second-btn" [disabled]="messageFormGroup.invalid || sending">
            Send
          </button>
        </div>
      </form>
    </ng-container>

    <ng-template #loader>
      <app-loader></app-loader>
    </ng-template>
  </div>
</div>
