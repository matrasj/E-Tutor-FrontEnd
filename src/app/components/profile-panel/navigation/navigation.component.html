<div class="profile-nav">
  <mat-sidenav-container class="nav-container">
    <mat-sidenav mode="side" opened="true" disableClose="true" class="nav-sidenav"></mat-sidenav>
    <mat-sidenav-content class="nav-content">
      <div class="activities">
        <div class="activity" routerLink="/profile/messages" [routerLinkActiveOptions]="{exact : true}" routerLinkActive="activity-active">
          <mat-icon>email</mat-icon>
          <p>Messages</p>
        </div>

        <div class="activity" routerLink="/profile" [routerLinkActiveOptions]="{exact : true}" routerLinkActive="activity-active">
          <mat-icon>dashboard</mat-icon>
          <p>Dashboard</p>
        </div>

        <div class="activity" routerLink="/profile/complete" routerLinkActive="activity-active">
          <mat-icon>account_box</mat-icon>
          <p>My account</p>
        </div>

        <div class="activity" routerLink="/profile/advertisements" routerLinkActive="activity-active">
          <mat-icon>list_alt</mat-icon>
          <p>Advertisements</p>
        </div>

        <div class="activity" routerLink="/profile/appointments" routerLinkActive="appointments">
          <mat-icon>calendar_today</mat-icon>
          <p>Appointments</p>
        </div>

        <div class="activity" (click)="onLoggingOut()">
          <mat-icon>logout</mat-icon>
          <p>Logout</p>
        </div>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
